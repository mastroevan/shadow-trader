name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # Unit tests run without a database; the placeholder URL above is only for
      # prisma generate, and would make DB-aware code try to connect.
      - run: npm run test
        env:
          DATABASE_URL: ""

  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      AUTH_SECRET: ci-dummy-secret
      AUTH_URL: http://localhost:3000
      AUTH_GITHUB_ID: ci-dummy-id
      AUTH_GITHUB_SECRET: ci-dummy-secret
      API_INTERNAL_BASE_URL: http://localhost:3001
      INTERNAL_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match .nvmrc; Node 20 lacks glob support in `node --test`, which the test script uses.
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  agent:
    name: Agent (import check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -c "import server"
        env:
          OPENAI_API_KEY: ci-dummy-key
          FINNHUB_API_KEY: ci-dummy-key
      - run: python -m pytest tests -q
        env:
          OPENAI_API_KEY: ci-dummy-key
          FINNHUB_API_KEY: ci-dummy-key
